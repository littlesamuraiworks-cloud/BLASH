<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>楽天ROOM 自動発掘ツール v2.1</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{margin:0;background:#f4f6f8;color:#222}.wrap{max-width:1280px;margin:auto;padding:20px}
.card{background:#fff;border-radius:14px;padding:18px;margin:0 0 16px;box-shadow:0 2px 12px #00000012}
h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{font-size:13px;font-weight:700}input,select,button{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd2d9;border-radius:8px;margin-top:6px;font:inherit}
button{background:#222;color:#fff;border:0;font-weight:700;cursor:pointer}.secondary{background:#fff;color:#222;border:1px solid #bbb}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:14px}
pre{white-space:pre-wrap;word-break:break-word;background:#111;color:#eee;padding:12px;border-radius:9px;min-height:100px}
.status{font-weight:800;margin-bottom:8px}.ok{color:#08783f}.bad{color:#a00}
.table{overflow:auto;max-height:650px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:8px;border-bottom:1px solid #e7e9ec;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#fafafa}
.copy{min-width:330px;max-width:450px;white-space:pre-wrap}.muted{color:#666}.danger{color:#a00;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>楽天ROOM 自動発掘ツール v2.1</h1>
<p class="muted">GitHub Pages → Cloudflare Worker → 楽天API。Access Keyはブラウザ/GitHubへ置きません。</p>
</div>

<div class="card">
<h2>初期設定</h2>
<div class="grid">
<label>APIプロキシURL
<input id="proxy" placeholder="https://あなたのworker.workers.dev">
</label>
<label>Application ID
<input id="appId" autocomplete="off">
</label>
<label>Affiliate ID（任意）
<input id="affiliateId" autocomplete="off">
</label>
<label>最低価格<input id="minPrice" type="number" value="1000"></label>
<label>最高価格<input id="maxPrice" type="number" value="30000"></label>
<label>最低レビュー数<input id="minReviews" type="number" value="20"></label>
<label>発掘件数<input id="target" type="number" value="30" min="5" max="100"></label>
<label>検索キーワード（カンマ区切り）
<input id="keywords" value="食品,健康,美容,家電,ファッション,インテリア,日用品,敬老の日">
</label>
</div>
<div class="actions">
<button onclick="health()">① 接続チェック</button>
<button onclick="diagnose()">② 楽天API診断</button>
<button onclick="discover()">③ 自動発掘</button>
<button class="secondary" onclick="saveCsv()">CSV保存</button>
</div>
</div>

<div class="card">
<h2>診断結果</h2>
<div id="status" class="status">未実行</div>
<pre id="diag">「接続チェック」から開始してください。</pre>
</div>

<div class="card">
<h2>発掘結果 <span id="count"></span></h2>
<div class="table">
<table><thead><tr>
<th>Score</th><th>商品</th><th>価格</th><th>評価</th><th>レビュー</th><th>料率</th><th>ポイント</th><th>ショップ</th><th>ROOM文</th><th>リンク</th>
</tr></thead><tbody id="rows"></tbody></table>
</div>
</div>
</div>

<script>
"use strict";
let results=[];
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function config(){
  return {
    proxy:$("proxy").value.trim().replace(/\/+$/,""),
    appId:$("appId").value.trim(),
    affiliateId:$("affiliateId").value.trim()
  };
}
function setDiag(ok,title,text){
  $("status").textContent=title;
  $("status").className="status "+(ok?"ok":"bad");
  $("diag").textContent=text;
}
async function request(api,params={}){
  const c=config();
  if(!c.proxy) throw new Error("APIプロキシURLが未入力です。");
  if(!/^https?:\/\//i.test(c.proxy)) throw new Error("APIプロキシURLは https:// から始めてください。");
  if(!c.appId) throw new Error("Application IDが未入力です。");
  const q=new URLSearchParams({api,applicationId:c.appId,...params});
  if(c.affiliateId) q.set("affiliateId",c.affiliateId);
  const url=c.proxy+"/rakuten?"+q.toString();
  const started=performance.now();
  let res;
  try{res=await fetch(url,{method:"GET",cache:"no-store",headers:{"Accept":"application/json"}})}
  catch(e){throw new Error("Workerへの接続に失敗しました。CORS、Worker URL、公開状態を確認してください。\\n"+e.message)}
  const text=await res.text();
  let body; try{body=JSON.parse(text)}catch{body={raw:text}}
  if(!res.ok){
    const code=body.error||body.errors?.errorCode||("HTTP_"+res.status);
    const msg=body.error_description||body.errors?.errorMessage||body.message||body.raw||"";
    throw new Error(`HTTP ${res.status}\\n楽天/Workerエラー: ${code}\\n詳細: ${msg}`);
  }
  return {body,ms:Math.round(performance.now()-started)};
}
async function health(){
  try{
    const c=config();
    if(!c.proxy) throw Error("APIプロキシURLが未入力です。");
    const started=performance.now();
    const r=await fetch(c.proxy+"/health",{cache:"no-store"});
    const t=await r.text(); let b; try{b=JSON.parse(t)}catch{b={raw:t}};
    if(!r.ok) throw Error("HTTP "+r.status+"\\n"+t);
    setDiag(true,"Worker接続OK",JSON.stringify({...b,latencyMs:Math.round(performance.now()-started)},null,2));
  }catch(e){setDiag(false,"Worker接続失敗",e.message)}
}
async function diagnose(){
  try{
    const x=await request("item-search",{keyword:"敬老の日",hits:1,sort:"-reviewCount",format:"json",formatVersion:2});
    const items=x.body.items||[];
    setDiag(true,"楽天API接続OK",
      "HTTP 200\\n応答時間: "+x.ms+"ms\\n取得件数: "+items.length+
      "\\n現在のページ: "+location.origin+location.pathname+
      "\\n\\n楽天APIレスポンス:\\n"+JSON.stringify(x.body,null,2).slice(0,7000));
  }catch(e){
    setDiag(false,"楽天API接続失敗",
      e.message+
      "\\n\\n次に確認すること:\\n"+
      "・WorkerにRAKUTEN_APP_ID / RAKUTEN_ACCESS_KEYがSecretとして設定されているか\\n"+
      "・Workerが最新コードでDeployされているか\\n"+
      "・ALLOWED_ORIGINが https://littlesamuraiworks-cloud.github.io になっているか\\n"+
      "・楽天アプリの許可設定とApplication ID/Access Keyの組み合わせが正しいか");
  }
}
function makeCopy(x){
  const name=x.itemName||"気になる商品";
  const price=Number(x.itemPrice||0).toLocaleString();
  const reviews=Number(x.reviewCount||0).toLocaleString();
  return `これ、気になったのでROOMにメモ✨\\n${name}\\n${price}円／レビュー${reviews}件。\\n人気の理由が気になる商品です！\\n気になる人はチェックしてみてね👇`;
}
async function discover(){
  results=[]; render();
  const keys=$("keywords").value.split(",").map(s=>s.trim()).filter(Boolean);
  const target=Math.min(100,Math.max(5,Number($("target").value)||30));
  try{
    for(const keyword of keys){
      if(results.length>=target) break;
      const x=await request("item-search",{
        keyword,hits:30,sort:"-reviewCount",format:"json",formatVersion:2,
        minPrice:$("minPrice").value,maxPrice:$("maxPrice").value,hasReviewFlag:1
      });
      for(const raw of x.body.items||[]){
        const item=raw.item||raw;
        const reviews=Number(item.reviewCount||0);
        if(reviews<Number($("minReviews").value||0)) continue;
        const rating=Number(item.reviewAverage||0), rate=Number(item.affiliateRate||0);
        const points=Number(item.pointRate||0), price=Number(item.itemPrice||0);
        const score=Math.min(40,Math.log10(reviews+1)*12)+rating*8+
          Math.min(20,rate*2)+Math.min(10,points)+(price>=1000&&price<=30000?10:0);
        results.push({...item,score:Math.round(score*10)/10,roomCopy:makeCopy(item)});
        if(results.length>=target) break;
      }
      render();
      await sleep(1600);
    }
    results.sort((a,b)=>b.score-a.score); render();
    setDiag(true,"自動発掘完了","候補数: "+results.length+"件");
  }catch(e){setDiag(false,"自動発掘失敗",e.message)}
}
function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]))}
function render(){
  $("count").textContent=results.length?`(${results.length}件)`:"";
  $("rows").innerHTML=results.map(x=>`<tr>
<td>${x.score}</td><td>${esc(x.itemName)}</td><td>${Number(x.itemPrice||0).toLocaleString()}円</td>
<td>${esc(x.reviewAverage||"-")}</td><td>${Number(x.reviewCount||0).toLocaleString()}</td>
<td>${esc(x.affiliateRate??"-")}%</td><td>${esc(x.pointRate??"-")}%</td><td>${esc(x.shopName)}</td>
<td class="copy">${esc(x.roomCopy)}</td><td><a href="${esc(x.itemUrl||x.affiliateUrl||"#")}" target="_blank" rel="noopener">楽天</a></td>
</tr>`).join("");
}
function saveCsv(){
  if(!results.length){alert("先に自動発掘してください。");return}
  const cols=["score","itemName","itemPrice","reviewAverage","reviewCount","affiliateRate","pointRate","shopName","roomCopy","itemUrl"];
  const q=v=>`"${String(v??"").replaceAll('"','""')}"`;
  const csv=[cols,...results.map(x=>cols.map(k=>x[k]))].map(r=>r.map(q).join(",")).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));
  a.download="rakuten_room_candidates.csv"; a.click();
}
</script>
</body></html>
